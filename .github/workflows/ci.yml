name: CI

on:
  pull_request:

# A force-push replaces the code under review, so the old run has no decision
# left to make. Cancel it instead of billing two runners for the same PR.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail the build on a warning rather than letting lint debt accumulate.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    # One runner for the complete decision. Audit used to be a second VM that
    # repeated checkout, toolchain setup, and dependency resolution.
    # Ubicloud, never a GitHub-hosted label: CI here runs on Ubicloud runners
    # and `ubuntu-latest` would quietly bill GitHub Actions minutes instead.
    # `-2` is deliberate rather than lazy: this job finishes in well under a
    # minute, and Ubicloud bills by vCPU-minute, so a larger runner costs more
    # for no wall-clock gain. Reach for `-4`/`-8` when a build is actually the
    # bottleneck.
    # ARM uses a separate Ubicloud pool and this pure Rust crate is portable.
    # The repository variable makes a pool switch an operations change instead
    # of another workflow PR if capacity moves again.
    runs-on: ${{ vars.UBICLOUD_RUNNER || 'ubicloud-standard-2-arm' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      # --all-targets covers tests and the live suite's compilation; the live
      # tests themselves are #[ignore]d and never run here. They need three
      # authenticated CLIs and spend real quota, neither of which belongs in CI.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      # `cargo test --all-targets` skips doctests, and the crate's usage
      # examples live in them.
      - name: Doctests
        run: cargo test --doc

      - name: Documentation builds without broken links
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # The published artifact is not what the other steps build: `exclude` can
      # drop a file the crate needs, and nothing above would notice. Checked on
      # every run rather than only on release PRs, because the mistake is made
      # in the commit that edits `exclude`, not the one that bumps the version.
      - name: The package builds from what would be published
        run: cargo package

      # The README links to it and a consumer reading it from a vendored crate
      # is exactly who it is for, so it must not be excluded by accident.
      - name: The changelog is in the package
        run: cargo package --list | grep -Fx CHANGELOG.md

      # `Cargo.lock` is not committed, per library convention, so there is
      # nothing for audit to read until one is resolved. That is also the more
      # meaningful check for a library: consumers resolve their own graph, so
      # what matters is whether a *fresh* resolution pulls in an advisory, not
      # whether some pinned snapshot did.
      - name: Resolve a dependency graph to audit
        run: cargo generate-lockfile

      # A prebuilt binary rather than `rustsec/audit-check`, which compiles
      # cargo-audit from source on every run. That took 2m53s here, against a
      # ~40s build for the crate itself, and Ubicloud bills by vCPU-minute.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Worth having now that the crate is published: an advisory against tokio
      # or serde reaches every consumer, and nothing else in CI would notice.
      - name: Audit dependencies
        run: cargo audit
